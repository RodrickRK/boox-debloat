<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Boox Debloat">
  <!-- Ink tile -->
  <rect width="64" height="64" rx="14" fill="#000"/>
  <!-- Tablet body: thin bezel, wider chin -->
  <rect x="17" y="8" width="30" height="48" rx="5" fill="none" stroke="#E6E6E3" stroke-width="2.5"/>
  <!-- E-ink screen -->
  <rect x="21" y="12" width="22" height="32" rx="1" fill="#E6E6E3"/>
  <!-- A switch turned off: the app is removed -->
  <rect x="25" y="24.5" width="14" height="7" rx="3.5" fill="none" stroke="#000" stroke-width="1.8"/>
  <circle cx="28.6" cy="28" r="1.9" fill="#000"/>
  <!-- Back button -->
  <rect x="28.5" y="48.5" width="7" height="2.4" rx="1.2" fill="#E6E6E3"/>
</svg>
