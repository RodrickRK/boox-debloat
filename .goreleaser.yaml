# Builds boox-debloat for Mac, Windows and Linux when a version tag is pushed,
# then updates the Homebrew tap and the Scoop bucket.
# Needs a TAP_GITHUB_TOKEN secret that can push to both repositories.
version: 2

project_name: boox-debloat

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos: [darwin, windows, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

# Mac: brew install --cask RodrickRK/tap/boox-debloat
homebrew_casks:
  - name: boox-debloat
    repository:
      owner: RodrickRK
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/RodrickRK/boox-debloat
    description: Safely debloat the Onyx Boox C69 M Star and keep the sleep screen working
    license: MIT
    dependencies:
      - cask: android-platform-tools
    # The app isn't signed by Apple, so clear the download quarantine flag.
    # Homebrew deprecated `postflight` blocks for `postflight_steps`, which
    # GoReleaser can't generate yet, so it goes in as a custom block.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/boox-debloat"], must_succeed: false
        end
      end

# Windows: scoop bucket add rodrickrk https://github.com/RodrickRK/scoop-bucket
#          scoop install boox-debloat
scoops:
  - name: boox-debloat
    repository:
      owner: RodrickRK
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/RodrickRK/boox-debloat
    description: Safely debloat the Onyx Boox C69 M Star and keep the sleep screen working
    license: MIT
    depends: ["adb"]
